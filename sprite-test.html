<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sprite Test</title>
<style>
body { margin: 0; background: #000; }
#box {
  width: 100vw;
  height: 100vh;
  background-image: url('assets/gate-sprite.png');
  background-size: 400% 400%;
  background-position: 0% 0%;
  background-repeat: no-repeat;
}
#info {
  position: fixed;
  top: 10px;
  left: 10px;
  color: #fff;
  font: 16px monospace;
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 6px;
  z-index: 99;
}
</style>
</head>
<body>
<div id="box"></div>
<div id="info">Frame: 0/15 — Scroll to advance</div>

<div style="height: 400vh; pointer-events:none;"></div>

<script>
const box = document.getElementById('box');
const info = document.getElementById('info');
const COLS = 4, ROWS = 4, TOTAL = 15;

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const maxScroll = document.body.scrollHeight - window.innerHeight;
  const progress = Math.min(scrollTop / maxScroll, 1);
  const f = Math.round(progress * TOTAL);
  const col = f % COLS;
  const row = Math.floor(f / COLS);
  const x = col === 0 ? 0 : (col / (COLS - 1)) * 100;
  const y = row === 0 ? 0 : (row / (ROWS - 1)) * 100;
  box.style.backgroundPosition = `${x}% ${y}%`;
  info.textContent = `Frame: ${f}/15 — pos: ${x.toFixed(1)}% ${y.toFixed(1)}%`;
});
</script>
</body>
</html>
