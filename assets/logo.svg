<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
    <!-- Theme-aware colors: currentColor for dark parts (adapts to text color), #0088cc for the blue arrow -->
    
    <!-- The outer right-pointing triangle outline -->
    <!-- It has a gap on the left edge. Left edge top: (40, 20) to (40, 45). Left edge bottom: (40, 75) to (40, 100). -->
    <!-- Top point: (40, 20) -> Right point: (100, 60) -> Bottom point: (40, 100) -->
    <path d="M 40 45 L 40 20 L 105 60 L 40 100 L 40 75 L 55 75 L 85 60 L 55 45 Z" fill="currentColor" />
    
    <!-- The inner blue arrow -->
    <!-- Enters from left (20, 50) -> points to (70, 60) -> back to (20, 70) -->
    <polygon points="20,50 45,50 70,60 45,70 20,70" fill="#0099d8" />

    <!-- Text: START -->
    <text x="125" y="68" font-family="'DM Sans', sans-serif" font-weight="700" font-size="48" fill="currentColor" letter-spacing="1">START</text>
    
    <!-- Text: Akademie -->
    <text x="127" y="98" font-family="'DM Sans', sans-serif" font-weight="400" font-size="22" fill="currentColor" letter-spacing="6">Akademie</text>
</svg>
